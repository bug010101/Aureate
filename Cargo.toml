[workspace]
resolver = "2"
members = [
    "crates/aur-core",
    "crates/aur-vault",
    "crates/aur-index",
    "crates/aur-export",
    "crates/aur-app",
]

[workspace.package]
version = "1.0.6"
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["zhoujin"]
repository = "https://github.com/bug010101/Aureate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
notify = "9"
rusqlite = { version = "0.43", features = ["bundled"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-svg = "0.15.1"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
