<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aureate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="side-head">
          <div class="brand"><span class="brand-mark">A</span><span class="brand-name">Aureate</span></div>
          <button id="vault-btn" class="ghost-btn" title="打开仓库">仓库</button>
        </header>
        <nav class="side-tabs">
          <button class="side-tab active" data-tab="files">文件</button>
          <button class="side-tab" data-tab="cards">卡片</button>
        </nav>
        <div class="side-body">
          <section id="files-pane" class="side-pane">
            <div class="pane-actions">
              <button id="new-doc" class="mini-btn">＋ 文档</button>
              <button id="open-file" class="mini-btn" title="打开单个 Markdown 文件">打开文件</button>
              <span class="flex-1"></span>
              <button id="search-btn" class="mini-btn" title="搜索 (Ctrl/Cmd+K)">搜索</button>
            </div>
            <div id="file-tree" class="tree"></div>
            <div class="recent" id="recent-list"></div>
          </section>
          <section id="cards-pane" class="side-pane hidden">
            <div class="pane-actions">
              <select id="card-filter-kind" class="mini-select">
                <option value="">全部类型</option>
                <option>实验卡</option><option>论文卡</option><option>想法卡</option>
                <option>会议卡</option><option>周卡</option>
              </select>
              <span class="flex-1"></span>
              <button id="new-card" class="mini-btn">＋ 卡片</button>
            </div>
            <div id="card-list" class="card-list"></div>
          </section>
        </div>
        <footer class="side-foot" id="vault-foot">未打开仓库</footer>
      </aside>

      <main id="main">
        <div id="topbar">
          <button id="mobile-menu" class="tool-btn">☰</button>
          <button id="mode-write" class="seg active">写作</button>
          <button id="mode-cards" class="seg">卡片</button>
          <div class="doc-title" id="doc-title">Aureate</div>
          <span class="flex-1"></span>
          <button id="btn-save" class="tool-btn" title="保存 Ctrl/Cmd+S">保存</button>
          <button id="btn-export" class="tool-btn primary" title="导出 PDF Ctrl/Cmd+E">导出 PDF</button>
          <button id="btn-batch" class="tool-btn" title="批量导出文件夹">批量</button>
          <button id="btn-settings" class="tool-btn" title="排版设置">设置</button>
          <button id="btn-theme" class="tool-btn" title="浅色 / 深色">◐</button>
        </div>

        <div id="workspace">
          <div id="write-view">
            <div id="editor-pane">
              <div id="editor-host">
                <div id="editor-gutter"></div>
                <textarea id="editor-textarea" spellcheck="false" placeholder="在这里写 Markdown……"></textarea>
              </div>
            </div>
            <div id="divider" title="拖拽调整分栏"></div>
            <div id="preview-pane">
              <div id="preview-toolbar">
                <span id="preview-state">预览</span>
                <span class="flex-1"></span>
                <button id="zoom-out" class="mini-btn">−</button>
                <span id="zoom-level">适应</span>
                <button id="zoom-in" class="mini-btn">＋</button>
              </div>
              <div id="preview-scroll"><div id="preview-sheet" class="sheet github"></div></div>
            </div>
          </div>

          <div id="cards-view" class="hidden">
            <div class="cards-toolbar">
              <div class="seg-group">
                <button class="seg active" data-cardview="form">表单</button>
                <button class="seg" data-cardview="timeline">时间线</button>
                <button class="seg" data-cardview="board">看板</button>
                <button class="seg" data-cardview="ledger">周历</button>
              </div>
              <span class="flex-1"></span>
              <button id="btn-cardbook" class="tool-btn">导出卡册</button>
            </div>
            <div id="cards-body"></div>
          </div>
        </div>

        <footer id="statusbar">
          <span id="status-words"></span>
          <span id="status-save"></span>
          <span class="flex-1"></span>
          <span id="status-info"></span>
        </footer>
      </main>

      <div id="settings-drawer" class="drawer hidden">
        <div class="drawer-head"><span>排版设置</span><button id="settings-close" class="ghost-btn">✕</button></div>
        <div class="drawer-body" id="settings-body"></div>
        <div class="drawer-foot">
          <button id="btn-copy-typ" class="ghost-btn">复制 Typst 源码</button>
          <span class="flex-1"></span>
          <button id="settings-done" class="tool-btn primary">完成</button>
        </div>
      </div>

      <div id="palette" class="hidden">
        <div class="palette-box">
          <input id="palette-input" placeholder="搜索文档与卡片，Enter 打开…" autocomplete="off" />
          <div id="palette-results"></div>
        </div>
      </div>

      <div id="modal" class="hidden">
        <div class="modal-box" id="modal-box"></div>
      </div>

      <div id="onboard" class="hidden">
        <div class="onboard-card">
          <div class="logo">A</div>
          <h1>Aureate</h1>
          <p class="tagline">只导出 PDF 的本地 Markdown 写作器</p>
          <div class="onboard-actions">
            <button id="onboard-pick" class="tool-btn primary">选择文件夹</button>
            <button id="onboard-file" class="tool-btn">打开单个文件</button>
          </div>
          <div class="onboard-hint">
            每次启动都由你手动选择，程序不记住路径<br />
            不会往仓库里写任何额外文件
          </div>
        </div>
      </div>

      <div id="toasts"></div>
      <div id="drop-overlay" class="hidden">松开以打开</div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
