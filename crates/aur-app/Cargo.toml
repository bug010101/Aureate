[package]
name = "aur-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
description = "Aureate — a Markdown writer that only exports PDF"

[[bin]]
name = "Aureate"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }
aur-core = { path = "../aur-core" }
aur-vault = { path = "../aur-vault" }
aur-index = { path = "../aur-index" }
aur-export = { path = "../aur-export" }
chrono = { workspace = true }
tracing = { workspace = true }
