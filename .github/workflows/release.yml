name: release

# Packaging happens on GitHub only — no local build scripts, no Node toolchain.
# macOS (universal dmg), Windows (msi + nsis), Linux (deb + AppImage)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ------------------------------------------------------------------ desktop
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            target: universal-apple-darwin
            bundles: dmg
            artifact: aureate-macos-universal
          - os: windows-latest
            label: Windows (x64)
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            artifact: aureate-windows-x64
          - os: ubuntu-22.04
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: aureate-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Linux bundling deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev \
            patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: ". -> target"

      # The Tauri CLI is a Rust binary; installing it here keeps the build
      # free of any JavaScript package manager.
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@^2

      - name: Build bundles
        working-directory: crates/aur-app
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find crates/aur-app/target -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
