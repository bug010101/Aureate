name: release

# Packaging happens on GitHub only — no local build scripts, no Node toolchain.
# Pure Rust app: cargo build → hand-assembled .app → dmg.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    name: macOS (universal)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: "true"

      - name: Build universal binary
        run: cargo build --release --target universal-apple-darwin --bin Aureate

      - name: Assemble Aureate.app
        run: |
          APP=Aureate.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal-apple-darwin/release/Aureate "$APP/Contents/MacOS/Aureate"
          cp crates/aur-app/icons/icon.icns "$APP/Contents/Resources/Aureate.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Aureate</string>
            <key>CFBundleDisplayName</key><string>Aureate</string>
            <key>CFBundleIdentifier</key><string>com.zhoujin.aureate</string>
            <key>CFBundleExecutable</key><string>Aureate</string>
            <key>CFBundleIconFile</key><string>Aureate</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.5</string>
            <key>CFBundleVersion</key><string>1.0.5</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"

      - name: Make dmg
        run: |
          mkdir -p dist
          hdiutil create -volname Aureate -srcfolder Aureate.app -ov -format UDZO "dist/Aureate-1.0.5-macos-universal.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: aureate-macos-universal
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
