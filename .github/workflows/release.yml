name: release

# Packaging happens on GitHub only — no local build scripts, no Node toolchain.
# macOS universal dmg only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: "true"

      # The Tauri CLI is a Rust binary; installing it here keeps the build
      # free of any JavaScript package manager.
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build bundle
        working-directory: crates/aur-app
        run: cargo tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -type f -name '*.dmg' -not -path './dist/*' -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: aureate-macos-universal
          path: dist/*
          if-no-files-found: error
